terms:
  title: "Key terms"
  lead: "Plain-language definitions for the domain acronyms used above."
  items:
    - {term: "[COVESA](https://covesa.global)", def: "Connected Vehicle Systems Alliance — the open industry body that maintains the VSS standard."}
    - {term: "[VSS](https://github.com/COVESA/vehicle_signal_specification)", def: "Vehicle Signal Specification — COVESA's open standard for modeling vehicle data in one shared vocabulary."}
    - {term: "[S2DM](https://github.com/COVESA/s2dm)", def: "Simplified Semantic Data Modeling — a graph/GraphQL-based way to express the VSS data model."}
    - {term: "FTE", def: "Full-Time Equivalent — one person's full-time workload; “~2.5 FTE” means roughly two and a half people's full-time workload."}
    - {term: "[MBSE](https://en.wikipedia.org/wiki/Model-based_systems_engineering)", def: "Model-Based Systems Engineering — designing from one machine-checkable model instead of scattered documents."}
    - {term: "[CI/CD](https://en.wikipedia.org/wiki/CI/CD)", def: "Continuous Integration / Continuous Delivery — automated build, test, and release pipelines."}
    - {term: "E/E · ECU", def: "A vehicle's Electrical/Electronic architecture; an ECU (Electronic Control Unit) is one of the many onboard computers it links."}
    - {term: "[MCP](https://modelcontextprotocol.io)", def: "Model Context Protocol — an open standard that lets AI agents securely use external tools and data."}
    - {term: "[EU Data Act](https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32023R2854)", def: "EU regulation governing access to and sharing of connected-product data, including vehicle data."}
    - {term: "[PR](https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/proposing-changes-to-your-work-with-pull-requests/about-pull-requests)", def: "Pull Request — a proposed code change submitted for review before it is merged."}
    - {term: "LLM", def: "Large Language Model — the class of AI models the agents are built on."}

