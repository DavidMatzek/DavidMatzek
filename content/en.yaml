case:
  pill: "Featured case"
  title: "AI-agent automation for VSS data-model governance"
  lead: "BMW's [VSS](https://github.com/COVESA/vehicle_signal_specification) (Vehicle Signal Specification) repo is the data model behind the Vehicle Shadow stream, consumed by 180+ backend applications — from customer-facing apps to dealer and backend systems. Manual pull-request (PR) review, board triage, release orchestration and CI-fixing consumed the equivalent of ~2.5 full-time employees — two external consultants and one internal position — until the budget for that setup was cut in January 2026. Non-technical stakeholders couldn't contribute without engineering support."
  built_title: "What I built"
  built:
    - "**7 purpose-built AI agents** orchestrating ~15 reusable skills: auto-triage CI failures, auto-rebase conflicts, classify EU Data Act requirements, generate changelogs and version bumps, sort the release board."
    - "**“VSS Explorer” self-service UI** — contributors without repo access submit signal requests directly; a backend pipeline turns them into structured issues and auto-generates compliant PRs, removing the git/PR literacy barrier."
    - "**Cost-aware LLM tooling** — a linter + rewriter benchmarked across 3 model tiers to pick the most cost-efficient option at equal quality."
  impact_title: "Impact"
  impact:
    - "Avoided **~€350k/year (~2.5 FTE)** of governance cost by replacing two consultants and one internal position, and ended the external consultant dependency, while serving 45+ regular contributors."
    - "Sustained a **weekly release cadence** through the budget cut, redirecting freed budget to other constrained projects."
    - "Delivered in parallel with a strategic **.vspec → GraphQL (S2DM)** data-model migration for the same 180+ applications."
    - "Work closely with **COVESA**: BMW's COVESA liaison department (set up for compliance reasons) works under my guidance, and I give implementation feedback to the VSS community."
  skills: "Agentic workflow design · CI/CD engineering · self-service process redesign · cost-aware LLM decisions · multi-year migration alongside live operations."
  note: "**Why this isn't on my public GitHub:** almost all of this delivery runs inside BMW's private GitHub Enterprise, so the code and commit history can't be shared publicly. I'm glad to walk through the architecture, agents, and results in detail on request."

