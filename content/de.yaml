snapshot:
  title: "Profil im Überblick"
  lead: "Hier helfe ich: geschäftskritische Datenbetriebe auch bei Budget- und Personalkürzungen am Laufen halten, ohne die langfristige Architekturqualität zu verlieren. **Als Nächstes:** KI beschleunigt sich, und ich möchte KI-getriebene Datensysteme in wachsenden Märkten aufbauen."
  items:
    - "Wiederkehrende manuelle Arbeit — und die Beraterkosten dahinter — durch KI-Automatisierung ersetzen."
    - "Der Führung datenbasierte Transparenz über Status, Kosten und Risiken geben."
    - "Plattformen durch gesteuerte Weiterentwicklung und Release-Disziplin zukunftsfähig halten."

proof:
  title: "Zahlen im Überblick"
  cards:
    - {num: "~350.000 €/Jahr", text: "vermiedene Governance-Kosten (~2,5 FTE: zwei Berater und eine interne Stelle ersetzt) durch ein KI-System aus 7 Agenten."}
    - {num: "~24\u200Ah → 35\u200Amin", text: "geschätzter täglicher Aufwand für ein Datenmodell mit 240 Nutzern (3 Personen × 8\u00A0h) — gehalten nach der Budget- und Beraterkürzung im Januar 2026."}
    - {num: "20 Arbeitstage", text: "bis zur Lieferung einer Self-Service-Funktion, die 6 Jahre offen war, und Budget für andere Projekte freigesetzt."}
    - {num: "180+ Anwendungen", text: "bei konstantem wöchentlichem Release-Rhythmus und deutlich weniger manuellem Aufwand."}

case:
  pill: "Referenzprojekt"
  title: "KI-Agenten-Automatisierung für die Governance des VSS-Datenmodells"
  lead: "BMWs [VSS](https://github.com/COVESA/vehicle_signal_specification)-Repository (Vehicle Signal Specification) ist das Datenmodell hinter dem Vehicle-Shadow-Stream und wird von 180+ Backend-Anwendungen genutzt — von kundennahen Apps bis zu Händler- und Backend-Systemen. Manuelles Pull-Request-Review (PR), Board-Triage, Release-Orchestrierung und CI-Fehlerbehebung verbrauchten das Äquivalent von ~2,5 Vollzeitstellen — zwei externe Berater und eine interne Stelle — bis das Budget für dieses Setup im Januar 2026 gekürzt wurde. Nicht-technische Stakeholder konnten ohne Engineering-Unterstützung nichts beitragen."
  built_title: "Was ich gebaut habe"
  built:
    - "**7 spezialisierte KI-Agenten**, die ~15 wiederverwendbare Skills orchestrieren: CI-Fehler automatisch triagieren, Konflikte automatisch rebasen, EU-Data-Act-Anforderungen klassifizieren, Changelogs und Versionssprünge erzeugen, das Release-Board sortieren."
    - "**Self-Service-UI „VSS Explorer“** — Beitragende ohne Repo-Zugriff reichen Signalanfragen direkt ein; eine Backend-Pipeline macht daraus strukturierte Issues und erzeugt automatisch konforme PRs, sodass die Git/PR-Hürde entfällt."
    - "**Kostenbewusstes LLM-Tooling** — ein Linter + Rewriter, über 3 Modellstufen verglichen, um bei gleicher Qualität die kosteneffizienteste Option zu wählen."
  impact_title: "Wirkung"
  impact:
    - "**~350.000 €/Jahr (~2,5 FTE)** an Governance-Kosten vermieden, indem zwei Berater und eine interne Stelle ersetzt wurden; die Abhängigkeit von externen Beratern ist beendet, bei 45+ regelmäßig Beitragenden."
    - "Den **wöchentlichen Release-Rhythmus** durch die Budgetkürzung gehalten und freigewordenes Budget in andere Projekte mit knappen Mitteln umgelenkt."
    - "Parallel geliefert zur strategischen **.vspec → GraphQL (S2DM)**-Datenmodell-Migration für dieselben 180+ Anwendungen."
    - "Enge Zusammenarbeit mit **COVESA**: BMWs COVESA-Verbindungsabteilung (aus Compliance-Gründen eingerichtet) arbeitet unter meiner Anleitung, und ich gebe Umsetzungs-Feedback an die VSS-Community."
  skills: "Agentic-Workflow-Design · CI/CD-Engineering · Neugestaltung von Self-Service-Prozessen · kostenbewusste LLM-Entscheidungen · mehrjährige Migration im laufenden Betrieb."
  note: "**Warum das nicht auf meinem öffentlichen GitHub liegt:** Fast die gesamte Arbeit läuft in BMWs privatem GitHub Enterprise, daher können Code und Commit-Historie nicht öffentlich geteilt werden. Auf Anfrage führe ich gern ausführlich durch Architektur, Agenten und Ergebnisse."

experience:
  title: "Berufserfahrung"
  roles:
    steward: "Verantwortlich für BMWs VSS-Fahrzeugdatenmodell (Vehicle Shadow), 180+ Consumer-Apps. 7 KI-Agenten und eine Self-Service-UI „VSS Explorer“ gebaut, die ~350.000 €/Jahr an Governance-Kosten vermieden und die Beraterabhängigkeit beendet haben; wöchentliche Releases trotz Budgetkürzung gehalten und parallel die Migration .vspec → GraphQL (S2DM) vorangetrieben."
    lead: "Eine Disziplin für frühe Datengestaltung über ein Bordnetz mit 60+ Steuergeräten (ECUs) etabliert; E/E-Anforderungen (physischer Bus) gesetzt, damit benötigte Daten die Datensammler im Fahrzeug von Anfang an erreichen."
    architect: "Middleware-basierte (ADAPT) Standardisierung zur Reduktion der Modellfragmentierung; Variantenmanagement und Testautomatisierung für derivatübergreifende Daten."
    function: "Funktionsverantwortlicher für eine kundennahe Fahrzeugfunktion von der Idee bis zum Go-live — ein Programm über ~3 Mio. € und 3 Jahre im gesamten V-Modell-Lebenszyklus. 6 Funktionen in Serie gebracht (zwei 2019, vier 2021); Erfinder bei Patentanmeldungen (siehe unten)."
