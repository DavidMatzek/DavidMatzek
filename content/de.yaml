terms:
  title: "Begriffe"
  lead: "Allgemeinverständliche Definitionen der oben verwendeten Fachabkürzungen."
  items:
    - {term: "[COVESA](https://covesa.global)", def: "Connected Vehicle Systems Alliance — der offene Branchenverband, der den VSS-Standard pflegt."}
    - {term: "[VSS](https://github.com/COVESA/vehicle_signal_specification)", def: "Vehicle Signal Specification — COVESAs offener Standard, um Fahrzeugdaten in einem gemeinsamen Vokabular zu modellieren."}
    - {term: "[S2DM](https://github.com/COVESA/s2dm)", def: "Simplified Semantic Data Modeling — eine graph-/GraphQL-basierte Art, das VSS-Datenmodell auszudrücken."}
    - {term: "FTE", def: "Full-Time Equivalent (Vollzeitäquivalent) — die Arbeitsleistung einer Vollzeitkraft; „~2,5 FTE“ bedeutet etwa zweieinhalb Vollzeitstellen."}
    - {term: "[MBSE](https://en.wikipedia.org/wiki/Model-based_systems_engineering)", def: "Model-Based Systems Engineering — Entwickeln auf Basis eines maschinell prüfbaren Modells statt verstreuter Dokumente."}
    - {term: "[CI/CD](https://en.wikipedia.org/wiki/CI/CD)", def: "Continuous Integration / Continuous Delivery — automatisierte Build-, Test- und Release-Pipelines."}
    - {term: "E/E · ECU", def: "Die elektrische/elektronische Architektur eines Fahrzeugs; ein ECU (Electronic Control Unit, Steuergerät) ist einer der vielen verbundenen Bordcomputer."}
    - {term: "[MCP](https://modelcontextprotocol.io)", def: "Model Context Protocol — ein offener Standard, mit dem KI-Agenten externe Werkzeuge und Daten sicher nutzen können."}
    - {term: "[EU Data Act](https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32023R2854)", def: "EU-Verordnung über den Zugang zu und die Weitergabe von Daten vernetzter Produkte, einschließlich Fahrzeugdaten."}
    - {term: "[PR](https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/proposing-changes-to-your-work-with-pull-requests/about-pull-requests)", def: "Pull Request — eine vorgeschlagene Codeänderung, die vor dem Mergen zur Prüfung eingereicht wird."}
    - {term: "LLM", def: "Large Language Model — die Klasse von KI-Modellen, auf denen die Agenten basieren."}

