name: Build CV & deploy landing page

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'cv/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TECTONIC_VERSION: "0.17.0"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Tectonic binary
        id: cache-tectonic
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/tectonic
          key: tectonic-${{ runner.os }}-${{ env.TECTONIC_VERSION }}

      - name: Install Tectonic
        if: steps.cache-tectonic.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "Downloading $url"
          curl -sSL "$url" -o tectonic.tar.gz
          tar xzf tectonic.tar.gz
          mkdir -p ~/.local/bin
          mv tectonic ~/.local/bin/

      - name: Add Tectonic to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Tectonic package bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-bundle-${{ runner.os }}-${{ hashFiles('cv/**/*.tex') }}
          restore-keys: |
            tectonic-bundle-${{ runner.os }}-

      - name: Build 2-page CV PDF
        run: |
          set -euo pipefail
          tectonic --version
          tex=cv/generated/2026-09-26_generic_senior-data-systems-architect_v1.tex
          tectonic "$tex" --outdir cv/generated
          mkdir -p site/assets
          cp "${tex%.tex}.pdf" site/assets/David-Matzek-CV.pdf

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
