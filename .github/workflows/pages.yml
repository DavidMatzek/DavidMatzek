name: Build CV & deploy landing page

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'cv/**'
      - 'content/**'
      - 'templates/**'
      - 'tools/build.py'
      - 'tools/check_pdf_pages.py'
      - 'requirements.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TECTONIC_VERSION: "0.17.0"
    steps:
      - uses: actions/checkout@v4

      - name: Cache Tectonic binary
        id: cache-tectonic
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/tectonic
          key: tectonic-${{ runner.os }}-${{ env.TECTONIC_VERSION }}

      - name: Install Tectonic
        if: steps.cache-tectonic.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          url="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "Downloading $url"
          curl -sSL "$url" -o tectonic.tar.gz
          tar xzf tectonic.tar.gz
          mkdir -p ~/.local/bin
          mv tectonic ~/.local/bin/

      - name: Add Tectonic to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Tectonic package bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-bundle-${{ runner.os }}-${{ hashFiles('cv/**/*.tex') }}
          restore-keys: |
            tectonic-bundle-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Render site and CV sources (EN + DE)
        run: python tools/build.py

      - name: Build 2-page CV PDFs
        run: |
          set -euo pipefail
          tectonic --version
          mkdir -p site/assets
          tectonic cv/generated/cv-en.tex --outdir cv/generated
          tectonic cv/generated/cv-de.tex --outdir cv/generated
          cp cv/generated/cv-en.pdf site/assets/David-Matzek-CV.pdf
          cp cv/generated/cv-de.pdf site/assets/David-Matzek-CV-DE.pdf
          python tools/check_pdf_pages.py site/assets/David-Matzek-CV.pdf site/assets/David-Matzek-CV-DE.pdf

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
