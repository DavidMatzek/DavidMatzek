positioning:
  summary: >-
    Data and systems architect with 8+ years in complex and regulated environments,
    focused on domain data modeling, governance, and scalable platform architectures —
    cutting operating cost and consultant dependency while accelerating delivery through
    AI automation.
  strengths:
    - Business to technology translation across product, engineering, and IT
